name: CI

on:
    push:
        branches: [main]
    pull_request:

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

defaults:
    run:
        shell: bash

permissions:
    contents: read

jobs:
    checks:
        name: Lint, types, build and tests
        runs-on: blacksmith-2vcpu-ubuntu-2404
        timeout-minutes: 15
        steps:
            - name: Checkout the code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Setup pnpm
              uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

            - name: Setup Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: '24.21.0'
                  cache: pnpm

            - name: Install dependencies
              id: install
              run: pnpm install --frozen-lockfile

            - name: Run Biome
              run: pnpm exec biome ci --max-diagnostics=none .

            - name: Run TypeScript type check
              run: pnpm typecheck

            - name: Build
              run: pnpm build

            - name: Check the built package loads as ESM and CommonJS
              run: |
                  node --input-type=module -e "import('@stakpass/sdk').then(m => { if (typeof m.StakPass?.init !== 'function') process.exit(1); })"
                  node -e "const m = require('@stakpass/sdk'); if (typeof m.StakPass?.init !== 'function') process.exit(1)"

            - name: Run tests
              if: ${{ !cancelled() && steps.install.outcome == 'success' }}
              run: pnpm test

    # pnpm 11 needs Node 22.13+, so older runtimes run the built package without it.
    runtime-compat:
        name: Built package on Node ${{ matrix.node }}
        runs-on: blacksmith-2vcpu-ubuntu-2404
        timeout-minutes: 10
        strategy:
            fail-fast: false
            matrix:
                node: ['18', '20']
        steps:
            - name: Checkout the code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Setup pnpm
              uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

            - name: Setup Node.js 24 to build
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: '24.21.0'
                  cache: pnpm

            - name: Install dependencies and build
              run: |
                  pnpm install --frozen-lockfile
                  pnpm build

            - name: Setup Node.js ${{ matrix.node }} to run
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: ${{ matrix.node }}

            - name: Smoke test the built package
              run: node scripts/smoke.mjs

    node-22:
        name: Tests on Node 22
        runs-on: blacksmith-2vcpu-ubuntu-2404
        timeout-minutes: 10
        steps:
            - name: Checkout the code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Setup pnpm
              uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

            - name: Setup Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: '22'
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Run tests
              run: pnpm test
